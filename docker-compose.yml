# This file is used to generate driver specific migrations.
version: '3.9'
services:
    mysql:
        image: mysql:9
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: start123
        ports:
            - '3306:3306'
    postgres:
        image: postgres:18
        restart: always
        environment:
            POSTGRES_PASSWORD: start123
        ports:
            - '5432:5432'
    redis:
        image: docker.io/bitnami/redis
        restart: always
        environment:
            ALLOW_EMPTY_PASSWORD: true
        ports:
            - '6379:6379'
    vault:
        image: vault:1.12.0
        environment:
            VAULT_DEV_ROOT_TOKEN_ID: start123
            VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8090
        ports:
            -  '8090:8090'
    ldap:
        image: osixia/openldap:2.6.15
        ports:
            - '3890:3890'
            - '6360:6360'
        environment:
            OPENLDAP_BOOTSTRAP_SUFFIX: dc=example,dc=com
            OPENLDAP_BOOTSTRAP_ORGANIZATION: example
            OPENLDAP_BOOTSTRAP_DATA_ROOT_DN: cn=admin,dc=example,dc=com
            OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED: '{SSHA}Cov5aqo617uVQRRXIED+aQyyGLqHvITL'
