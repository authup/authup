## @section Cache (Valkey / external Redis)
## Optional, but REQUIRED when server.replicaCount > 1 (token blocklist,
## authorization-code store and MFA challenges are cache-backed) and strongly
## recommended when MFA is enabled.

## Built-in single-instance Valkey (docker-official image, Redis-compatible).
valkey:
  # -- Deploy the built-in Valkey instance
  enabled: false
  image:
    # -- Valkey image registry
    registry: docker.io
    # -- Valkey image repository (docker official image)
    repository: valkey/valkey
    # -- Valkey image tag
    tag: "8"
    # -- Valkey image pull policy
    pullPolicy: IfNotPresent
  auth:
    # -- Valkey password ("" = generate once, keep across upgrades)
    password: ""
  persistence:
    # -- Persist Valkey data (the cache content is reconstructable; default off)
    enabled: false
    # -- PVC size
    size: 1Gi
    # -- PVC storage class
    storageClass: ""
  # @schema
  # additionalProperties: true
  # @schema
  # -- Valkey container resources
  resources:
    # @schema
    # additionalProperties: true
    # @schema
    requests:
      cpu: 50m
      memory: 64Mi
    # @schema
    # additionalProperties: true
    # @schema
    limits:
      memory: 256Mi
  # @schema
  # additionalProperties: true
  # @schema
  # -- Valkey pod security context
  podSecurityContext:
    enabled: true
    fsGroup: 999
  # @schema
  # additionalProperties: true
  # @schema
  # -- Valkey container security context
  containerSecurityContext:
    enabled: true
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # @schema
  # additionalProperties: true
  # @schema
  # -- Valkey node selector
  nodeSelector: {}
  # -- Valkey tolerations
  tolerations: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- Valkey affinity
  affinity: {}

externalRedis:
  # -- Full external Redis/Valkey connection URL (redis://[user:pass@]host:port); stored in a chart-managed secret
  url: ""
  # -- External Redis host (alternative to url; the chart composes the URL)
  host: ""
  # -- External Redis port
  port: 6379
  # -- External Redis password
  password: ""
  # -- Existing secret holding a FULL connection URL (tpl-rendered)
  existingSecret: ""
  # -- Key inside externalRedis.existingSecret holding the connection URL
  existingSecretKey: redis-connection-string

## @section SMTP

smtp:
  # -- SMTP connection string (smtp(s)://user:pass@host:port); stored in a chart-managed secret
  connectionString: ""
  # -- Existing secret holding the SMTP connection string (tpl-rendered)
  existingSecret: ""
  # -- Key inside smtp.existingSecret holding the connection string
  existingSecretKey: smtp-connection-string

## @section server-core (IdP / API)

server:
  # -- Deploy the server-core service
  enabled: true
  # -- Run API-only server pods and deploy consoles separately (requires the
  # public URL at the origin root because console prefixes are fixed)
  splitConsoles: false
  # -- Number of server-core replicas (values > 1 REQUIRE a configured cache)
  replicaCount: 1
  # -- Public URL of Authup (PUBLIC_URL), shared by the API and consoles and
  # used as the OIDC issuer origin.
  # "" = derived from server.ingress when enabled. Changing it later breaks
  # enrolled WebAuthn credentials and the OIDC issuer.
  publicUrl: ""
  # -- Additional trusted first-party app origins (TRUSTED_ORIGINS). Each entry
  # is added to the redirect allowlist of the per-realm built-in system clients
  # (admin-console, account-console), so any listed origin can complete a login
  # and obtain a full-permission token. A host may carry a single "*"
  # (https://*.example.com); "**" in a host is rejected by authup at boot.
  # List or comma-separated string; tpl-rendered.
  trustedOrigins: []
  # -- TRUST_PROXY setting. The chart defaults to one trusted hop (the ingress),
  # not authup's spoofable trust-everything default
  trustProxy: "1"
  features:
    # -- Enable self-service user registration (REGISTRATION_ENABLED)
    registration: false
    # -- Enable password recovery (PASSWORD_RECOVERY_ENABLED; requires SMTP)
    passwordRecovery: false
    # -- Enable email verification (EMAIL_VERIFICATION_ENABLED; requires SMTP)
    emailVerification: false
    # @schema
    # type: [boolean, string]
    # required: true
    # @schema
    # -- Deprecated: use accountConsole.enabled. Any non-empty value fails.
    accountConsole: ""
  mfa:
    # -- Enable multi-factor authentication (MFA_ENABLED)
    enabled: false
    # -- Require MFA for every user (MFA_REQUIRED; needs mfa.enabled)
    required: false
  # @schema
  # additionalProperties: true
  # @schema
  # -- Extra environment variables rendered literally into the env ConfigMap
  # (map of NAME: value) for options without first-class values, e.g.
  # AUTH_CONSOLE_PATH / ACCOUNT_CONSOLE_PATH, which replace a served console
  # with your own build (pair them with extraVolumes; the substituted package
  # owns the login flow, so use server.theme for branding instead). In
  # split-console mode set them in authConsole.config / accountConsole.config:
  # `start core` does not read console paths
  config: {}
  # -- Content of authup.yml mounted at /etc/authup/authup.yml for file-only
  # options (middleware objects, per-field SMTP, CORS allowlist). Environment
  # variables always win over file values.
  configuration: ""
  # -- Existing ConfigMap holding authup.yml (tpl-rendered)
  existingConfigmap: ""
  provisioning:
    # -- Mount provisioning files consumed at boot (fail-closed: an invalid file aborts startup)
    enabled: false
    # @schema
    # additionalProperties: true
    # @schema
    # -- Map of filename -> file content (tpl-rendered; the extension selects
    # the reader). Lands in a ConfigMap — credential-bearing provisioning
    # content belongs in existingSecret instead
    files: {}
    # -- Existing ConfigMap with provisioning files (tpl-rendered)
    existingConfigMap: ""
    # -- Existing Secret with provisioning files (tpl-rendered; takes
    # precedence — use for provisioning content that carries credentials)
    existingSecret: ""
  theme:
    # -- Mount an operator theme for the served consoles (auth, admin and
    # account). Experimental upstream: the directory layout and the theme*
    # options may change in a minor release
    enabled: false
    # -- Document title of the served consoles ("" = authup's own)
    title: ""
    # -- Favicon path, relative to the theme root and under assets/
    # (e.g. assets/favicon.svg). Must be a key of files
    favicon: ""
    # -- Logo replacing the built-in mark on both consoles, under assets/.
    # Painted into the existing mark's box, so it needs no sizing
    logo: ""
    # -- Dark-mode logo variant, under assets/. Without it dark mode reuses
    # logo, which disappears when the mark is drawn dark-on-light
    logoDark: ""
    # -- Stylesheet path, under assets/ and ending in .css. Linked last, so it
    # beats the token block; it is unlayered, so set dark colors explicitly
    stylesheet: ""
    # @schema
    # additionalProperties: true
    # @schema
    # -- CSS custom properties applied in both color modes (tpl-rendered).
    # --authup-periwinkle alone recolors buttons, focus rings and links.
    # A color set here also wins in dark mode: put surface colors in both
    # tokens and tokensDark
    tokens: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- CSS custom properties applied in dark mode only (tpl-rendered)
    tokensDark: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Map of path -> file content, relative to the theme root (tpl-rendered).
    # Keys may carry a "/" ("assets/theme.css") and are projected into
    # subdirectories. Only assets/ is served over HTTP. Text only — use
    # existingConfigMap with binaryData for images. Set theme.json here only
    # when writing the manifest by hand instead of using the values above
    files: {}
    # -- Existing ConfigMap holding the theme (tpl-rendered name). Use for
    # binary assets, which cannot be expressed in files. Mounted whole, so it
    # must carry theme.json itself and excludes the manifest values above
    existingConfigMap: ""
    # -- Key -> path projection for existingConfigMap, so its keys can land in
    # subdirectories (e.g. [{key: theme-css, path: assets/theme.css}]).
    # Empty mounts every key flat at the theme root
    existingConfigMapItems: []
    # -- Read fragments/head.html and splice it into the console <head>. Raw,
    # unsanitized markup on the identity provider origin, so it is opt-in
    fragmentsEnabled: false
  migration:
    # -- Run `migration run` as a pre-upgrade hook Job. Recommended
    # for multi-replica deployments (serializes DDL before pods roll). Fresh
    # installs and non-persistent built-in databases migrate at boot regardless.
    # Under useHelmHooks=false the Job runs as an ArgoCD Sync-phase hook ordered
    # after the built-in database by sync-wave, so it is safe from the first sync
    enabled: false
    # -- Job backoff limit
    backoffLimit: 3
    # -- Delete the Job this many seconds after it finishes ("" = keep)
    ttlSecondsAfterFinished: 300
    # @schema
    # additionalProperties: true
    # @schema
    # -- Job pod annotations
    podAnnotations: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Job resources ({} = server resources defaults)
    resources: {}
  # -- Override the container command
  command: []
  # -- Override the container args
  args: []
  # -- Extra environment variables for the server container
  extraEnvVars: []
  # -- Extra ConfigMap with environment variables (tpl-rendered name)
  extraEnvVarsCM: ""
  # -- Extra Secret with environment variables (tpl-rendered name)
  extraEnvVarsSecret: ""
  # -- Extra volumes (tpl-rendered)
  extraVolumes: []
  # -- Extra volume mounts (tpl-rendered)
  extraVolumeMounts: []
  # -- Init containers (tpl-rendered)
  initContainers: []
  # -- Sidecar containers (tpl-rendered)
  sidecars: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- Container lifecycle hooks
  lifecycleHooks: {}
  # -- Pod host aliases
  hostAliases: []
  # -- Pod termination grace period (server-core tears down within ~10s after signal)
  terminationGracePeriodSeconds: 30
  # @schema
  # additionalProperties: true
  # @schema
  # -- Deployment update strategy
  updateStrategy:
    type: RollingUpdate
  # -- Deployment revision history limit
  revisionHistoryLimit: 3
  # @schema
  # additionalProperties: true
  # @schema
  # -- Pod annotations (tpl-rendered)
  podAnnotations: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Pod labels (tpl-rendered)
  podLabels: {}
  # -- Disable the checksum annotations that roll pods on config/secret changes
  disableRestartOnChanges: false
  # @schema
  # additionalProperties: true
  # @schema
  # -- Pod security context
  podSecurityContext:
    enabled: true
    fsGroup: 1000
  # @schema
  # additionalProperties: true
  # @schema
  # -- Container security context. The upstream image runs as root and needs
  # writable log and npm cache paths; the chart mounts emptyDirs at
  # /var/log/authup and /tmp.
  containerSecurityContext:
    enabled: true
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
    readOnlyRootFilesystem: false
  # @schema
  # additionalProperties: true
  # @schema
  # -- Server container resources
  resources:
    # @schema
    # additionalProperties: true
    # @schema
    requests:
      cpu: 250m
      memory: 512Mi
    # @schema
    # additionalProperties: true
    # @schema
    limits:
      memory: 2Gi
  startupProbe:
    # -- Enable the startup probe (first boot runs database creation, migrations and provisioning)
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
    successThreshold: 1
  livenessProbe:
    # -- Enable the liveness probe (GET / status endpoint)
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    # -- Enable the readiness probe (GET / status endpoint)
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  # @schema
  # additionalProperties: true
  # @schema
  # -- Custom startup probe overriding the structured one
  customStartupProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Custom liveness probe
  customLivenessProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Custom readiness probe
  customReadinessProbe: {}
  # @schema
  # additionalProperties: true
  # @schema
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- Affinity (overrides the anti-affinity preset when set)
  affinity: {}
  # -- Pod anti-affinity preset: soft, hard or ""
  podAntiAffinityPreset: soft
  # -- Topology spread constraints (a missing labelSelector is filled with the pod's selector labels)
  topologySpreadConstraints: []
  # -- Priority class name
  priorityClassName: ""
  # -- Scheduler name
  schedulerName: ""
  service:
    # -- Service type
    type: ClusterIP
    ports:
      # -- Service HTTP port (the container port is fixed at 3000)
      http: 3000
    nodePorts:
      # -- Node port ("" = auto-assign)
      http: ""
    # -- Static cluster IP
    clusterIP: ""
    # -- LoadBalancer IP
    loadBalancerIP: ""
    # -- LoadBalancer source ranges
    loadBalancerSourceRanges: []
    # -- External traffic policy
    externalTrafficPolicy: Cluster
    # -- Session affinity
    sessionAffinity: None
    # @schema
    # additionalProperties: true
    # @schema
    # -- Session affinity config
    sessionAffinityConfig: {}
    # @schema
    # additionalProperties: true
    # @schema
    # -- Service annotations (tpl-rendered)
    annotations: {}
    # -- Extra service ports
    extraPorts: []
  ingress:
    # -- Enable ingress for server-core. NOTE: this also exposes the
    # UNAUTHENTICATED /metrics endpoint publicly — block it at the ingress
    # controller or disable it via server.configuration
    # (core.middlewarePrometheus: false) when it is not scraped
    enabled: false
    # -- Ingress hostname (tpl-rendered); also drives the derived PUBLIC_URL
    hostname: ""
    # -- Ingress path
    path: /
    # -- Ingress path type
    pathType: Prefix
    # -- Ingress class name
    ingressClassName: ""
    # @schema
    # additionalProperties: true
    # @schema
    # -- Ingress annotations (tpl-rendered). Token responses are large; with
    # ingress-nginx consider proxy-buffer-size 16k+.
    annotations: {}
    # -- Enable TLS for the hostname (secret <hostname>-tls unless extraTls overrides)
    tls: false
    # -- Request a cert-manager certificate (adds kubernetes.io/tls-acme)
    certManager: false
    # -- Extra hosts
    extraHosts: []
    # -- Extra paths for the primary host
    extraPaths: []
    # -- Extra TLS entries
    extraTls: []
    # -- Full custom rules (tpl-rendered; appended after the generated rules)
    extraRules: []
  route:
    # @schema
    # type: [boolean, string]
    # required: true
    # @schema
    # -- Create a Gateway API HTTPRoute for server-core (tpl-rendered: a string rendering to
    # "true" enables it, so an umbrella chart can drive this from one of its own switches;
    # "false" and "" disable it, anything else fails the render)
    enabled: false
    # -- Route hostnames ([] = derived from server.publicUrl / ingress hostname; only the host is kept, a public
    # URL path is dropped and needs its own matches entry)
    hostnames: []
    # -- Gateway parentRefs
    parentRefs: []
    # @schema
    # additionalProperties: true
    # @schema
    # -- HTTPRoute annotations
    annotations: {}
    # -- Rule matches (tpl-rendered); [] is the Gateway API default, PathPrefix "/"
    matches: []
    # -- Rule filters (tpl-rendered), e.g. a URLRewrite stripping a path prefix
    filters: []
  metrics:
    # -- The /metrics endpoint is UNAUTHENTICATED; keep it off the public ingress
    serviceMonitor:
      # -- Create a prometheus-operator ServiceMonitor scraping /metrics
      enabled: false
      # -- ServiceMonitor namespace ("" = release namespace)
      namespace: ""
      # -- Scrape interval
      interval: 30s
      # -- Scrape timeout
      scrapeTimeout: ""
      # @schema
      # additionalProperties: true
      # @schema
      # -- ServiceMonitor labels
      labels: {}
      # -- Honor labels
      honorLabels: false
      # -- Metric relabelings
      metricRelabelings: []
      # -- Relabelings
      relabelings: []
      # -- Job label
      jobLabel: ""
  pdb:
    # -- Create a PodDisruptionBudget for server-core
    create: false
    # -- Minimum available pods
    minAvailable: ""
    # -- Maximum unavailable pods (defaults to 1 when both are empty)
