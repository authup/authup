# yaml-language-server: $schema=values.schema.json

## @section Global parameters

# @schema
# type: object
# additionalProperties: true
# @schema
global:
  # -- Global container image registry override (takes precedence over image.registry)
  imageRegistry: ""
  # -- Global image pull secrets (list of names or objects)
  imagePullSecrets: []
  # -- Global default storage class for dynamic provisioning
  defaultStorageClass: ""

## @section Common parameters

# -- Override the chart name
nameOverride: ""
# -- Override the fully qualified release name
fullnameOverride: ""
# -- Override the release namespace
namespaceOverride: ""
# @schema
# additionalProperties: true
# @schema
# -- Labels added to every object
commonLabels: {}
# @schema
# additionalProperties: true
# @schema
# -- Annotations added to every object
commonAnnotations: {}
# -- Extra objects to deploy (rendered through tpl; list of manifests or strings)
extraDeploy: []
# -- Render Helm hook annotations on the migration Job. Set false only for
# ArgoCD, which reads its own Sync-phase, sync-wave annotations instead.
# ArgoCD also understands Helm hooks, but maps pre-upgrade to an unordered
# PreSync hook: with server.migration.enabled and a built-in database, set
# false so the Job waits for the database instead of deadlocking the first
# sync. Flux and plain helm need true: a plain Job's pod template is
# immutable, so the next upgrade cannot patch it.
useHelmHooks: true
diagnosticMode:
  # -- Start every container with a sleep command and disable probes (debugging)
  enabled: false
  # -- Command overriding the containers' command in diagnostic mode
  command:
    - sleep
  # -- Args overriding the containers' args in diagnostic mode
  args:
    - infinity

## @section Authup image

image:
  # -- Authup image registry
  registry: docker.io
  # -- Authup image repository (one image serves every application role)
  repository: authup/authup
  # -- Authup image tag (defaults to the chart appVersion)
  tag: ""
  # -- Authup image digest (takes precedence over tag)
  digest: ""
  # -- Authup image pull policy
  pullPolicy: IfNotPresent
  # -- Authup image pull secrets
  pullSecrets: []

## @section Authentication bootstrap
## Credentials seeded into authup at boot. Empty passwords are generated once and
## kept stable across upgrades via lookup.
## GITOPS WARNING: lookup is inert under `helm template` and ArgoCD-style
## renders — every sync would then apply a NEW random value, roll the pods via
## the checksum annotation, and desync the Secret from the live credential
## (authup only applies the admin password at first provisioning unless the
## reset flag is set). GitOps users MUST set explicit values or auth.existingSecret.

auth:
  # -- Initial admin user password ("" = generate once, keep across upgrades).
  # Changing it after the first install only takes effect with
  # adminPasswordReset=true for one upgrade cycle
  adminPassword: ""
  # -- Re-assert the admin password on every boot (USER_ADMIN_PASSWORD_RESET)
  adminPasswordReset: false
  # -- Provision the built-in system client (CLIENT_SYSTEM_ENABLED); required for machine-to-machine consumers
  systemClientEnabled: false
  # -- System client secret ("" = generate once when systemClientEnabled)
  systemClientSecret: ""
  # -- Re-assert the system client secret on every boot (CLIENT_SYSTEM_SECRET_RESET)
  systemClientSecretReset: false
  # -- Optional AES-256 key-encryption-key wrapping the realm key store
  # (SECRETS_ENCRYPTION_KEY, base64-encoded 32 bytes). Deliberately never
  # generated by the chart: this key is effectively write-once — losing or
  # rotating it bricks wrapped MFA seeds and signing keys. Set it explicitly
  # here, or reference it via existingSecret plus
  # secretsEncryptionKeyEnabled=true, and back it up.
  secretsEncryptionKey: ""
  # -- Declare that auth.existingSecret carries the secrets encryption key
  # (under secretKeys.secretsEncryptionKeyKey). Required for the key to be
  # wired from an existing secret — it is never inferred, so a missing key can
  # not silently fail open into plaintext-at-rest
  secretsEncryptionKeyEnabled: false
  # -- Existing secret holding the keys below instead of the chart-managed secret (tpl-rendered)
  existingSecret: ""
  secretKeys:
    # -- Key inside the (existing) secret holding the admin password
    adminPasswordKey: admin-password
    # -- Key inside the (existing) secret holding the system client secret
    systemClientSecretKey: system-client-secret
    # -- Key inside the (existing) secret holding the secrets encryption key
    secretsEncryptionKeyKey: secrets-encryption-key

## @section Database
## Exactly one of: built-in postgresql, built-in mysql, or externalDatabase.

database:
  # -- Database engine when using externalDatabase: postgres or mysql
  type: postgres

externalDatabase:
  # -- External database host (tpl-rendered). Setting this selects the external database
  host: ""
  # -- External database port ("" = engine default: 5432 / 3306)
  port: ""
  # -- External database user
  user: authup
  # -- External database name (must exist, or the user needs CREATE privilege)
  database: authup
  # -- External database password (stored in a chart-managed secret, never inline env)
  password: ""
  # -- Existing secret with the database password (tpl-rendered)
  existingSecret: ""
  # -- Key inside externalDatabase.existingSecret holding the password
  existingSecretPasswordKey: password

## Built-in single-instance PostgreSQL (docker-official image).
## Convenience for dev / small production; for serious deployments bring an
## external database or an operator such as CloudNativePG.
postgresql:
  # -- Deploy the built-in PostgreSQL instance
  enabled: true
  image:
    # -- PostgreSQL image registry
    registry: docker.io
    # -- PostgreSQL image repository (docker official image)
    repository: postgres
    # -- PostgreSQL image tag
    tag: "17"
    # -- PostgreSQL image pull policy
    pullPolicy: IfNotPresent
  auth:
    # -- PostgreSQL application username
    username: authup
    # -- PostgreSQL password ("" = generate once, keep across upgrades)
    password: ""
    # -- PostgreSQL database name (created on first boot)
    database: authup
  persistence:
    # -- Persist PostgreSQL data
    enabled: true
    # -- PVC size
    size: 8Gi
    # -- PVC storage class ("" = cluster default; global.defaultStorageClass wins)
    storageClass: ""
    # -- Use an existing PVC instead of creating one
    existingClaim: ""
  # @schema
  # additionalProperties: true
  # @schema
  # -- PostgreSQL container resources
  resources:
    # @schema
    # additionalProperties: true
    # @schema
    requests:
      cpu: 100m
      memory: 256Mi
    # @schema
    # additionalProperties: true
    # @schema
    limits:
      memory: 1Gi
  # @schema
  # additionalProperties: true
  # @schema
  # -- PostgreSQL pod security context
  podSecurityContext:
    enabled: true
    fsGroup: 999
  # @schema
  # additionalProperties: true
  # @schema
  # -- PostgreSQL container security context
  containerSecurityContext:
    enabled: true
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # @schema
  # additionalProperties: true
  # @schema
  # -- PostgreSQL node selector
  nodeSelector: {}
  # -- PostgreSQL tolerations
  tolerations: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- PostgreSQL affinity
  affinity: {}
  # -- Extra environment variables for the PostgreSQL container
  extraEnvVars: []

## Built-in single-instance MySQL (docker-official image). Same caveats as postgresql.
mysql:
