      cpu: 100m
      memory: 256Mi
    # @schema
    # additionalProperties: true
    # @schema
    limits:
      memory: 1Gi
  # @schema
  # additionalProperties: true
  # @schema
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # @schema
  # additionalProperties: true
  # @schema
  # -- Affinity (overrides the anti-affinity preset when set)
  affinity: {}
  # -- Pod anti-affinity preset: soft, hard or ""
  podAntiAffinityPreset: soft
  # -- Topology spread constraints
  topologySpreadConstraints: []
  # -- Priority class name
  priorityClassName: ""
  # -- Scheduler name
  schedulerName: ""
  pdb:
    # -- Create a PodDisruptionBudget for the worker
    create: false
    # -- Minimum available pods
    minAvailable: ""
    # -- Maximum unavailable pods (defaults to 1 when both are empty)
    maxUnavailable: ""
  autoscaling:
    hpa:
      # -- Enable HPA for the worker
      enabled: false
      # -- Minimum replicas
      minReplicas: 1
      # -- Maximum replicas
      maxReplicas: 3
      # -- Target CPU utilization percentage
      targetCPU: 75
      # -- Target memory utilization percentage
      targetMemory: ""
  networkPolicy:
    # -- Create an egress NetworkPolicy for the worker
    enabled: false
    # -- Allow all egress
    allowExternalEgress: true
    # -- Extra egress rules
    extraEgress: []

## @section Service account

serviceAccount:
  # -- Create a ServiceAccount (shared by all application roles)
  create: true
  # -- ServiceAccount name ("" = generated from the fullname)
  name: ""
