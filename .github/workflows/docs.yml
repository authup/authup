name: Deploy

on:
    push:
        branches:
            - master
        paths:
            - 'docs/**'
            - 'apps/authup/**'
            # deliberately the whole workspace rather than the query
            # subtree: the reference page derives its per-entity tables from
            # the schema registry, but its route lists from the
            # `@DQuerySchema` markers on the controllers and its release from
            # the manifest, so a narrower filter would let a newly mounted
            # read go missing from a published page with nothing to notice it.
            - 'apps/server-core/**'
            - 'packages/server-config/**'
            - 'packages/server-config-kit/**'
            - '.github/workflows/docs.yml'
    pull_request:
        branches:
            - master
        paths:
            - 'docs/**'
            - 'apps/authup/**'
            # deliberately the whole workspace rather than the query
            # subtree: the reference page derives its per-entity tables from
            # the schema registry, but its route lists from the
            # `@DQuerySchema` markers on the controllers and its release from
            # the manifest, so a narrower filter would let a newly mounted
            # read go missing from a published page with nothing to notice it.
            - 'apps/server-core/**'
            - 'packages/server-config/**'
            - 'packages/server-config-kit/**'
            - '.github/workflows/docs.yml'

env:
    NODE_VERSION: 24

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6

            - name: Install
              uses: ./.github/actions/install
              with:
                  node-version: ${{ env.NODE_VERSION }}

            # `authup config schema` prints the JSON Schema of the whole
            # authup.yml document, so the CLI has to exist before the site is
            # built.
            - name: Build
              uses: ./.github/actions/build

            # Served at the URL a configuration file's
            # `# yaml-language-server: $schema=` line names. Generated here
            # rather than committed, so a registry change can never leave a
            # stale document behind.
            - name: Generate config schema
              run: |
                  mkdir -p docs/src/public/schema
                  node apps/authup/dist/index.mjs config schema > docs/src/public/schema/config.json

            # The per-entity query vocabulary, one section per registered
            # schema, read out of the OpenAPI document the build above
            # emitted. Generated for the same reason as the schema: the
            # published tables are a projection of the registry, so a page
            # that could lag behind it would document a query surface no
            # deployment serves.
            - name: Generate query reference
              run: |
                  node apps/server-core/scripts/query-reference.mjs \
                      > docs/src/guide/development/api-query-reference.md

            # after the generated pages, and again: the repo build above ran
            # the vitepress build before they existed.
            - name: Build docs
              run: npm run build -w docs

            - name: Upload artifact
              if: ${{ github.event_name == 'push' }}
              uses: actions/upload-artifact@v7
              with:
                  name: docs-dist
                  path: ./docs/src/.vitepress/dist

    deploy:
        if: ${{ github.event_name == 'push' }}
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v8
              with:
                  name: docs-dist
                  path: ./dist

            - name: CNAME
              run: echo "authup.org" > ./dist/CNAME

            - name: Deploy
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
