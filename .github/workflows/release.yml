name: Release

on:
    push:
        branches:
            - master
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to publish (e.g. 1.0.0-beta.32)'
                required: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
    NODE_VERSION: 24

permissions:
    packages: write
    contents: write
    pull-requests: write
    id-token: write

defaults:
    run:
        shell: bash

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest

        steps:
            -   uses: googleapis/release-please-action@v5
                if: github.event_name == 'push'
                id: release
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}

            -   name: Set publish flags
                id: flags
                run: |
                    if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                        echo "should_publish=true" >> "$GITHUB_OUTPUT"
                        VERSION="${{ inputs.version }}"
                    else
                        echo "should_publish=${{ steps.release.outputs.releases_created }}" >> "$GITHUB_OUTPUT"
                        VERSION="${{ steps.release.outputs.tag_name }}"
                    fi
                    VERSION="${VERSION#v}"
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"

                    # latest deliberately follows prereleases while no stable line exists (docs reference authup/authup:latest)
                    TAGS="latest"
                    if [[ "$VERSION" == *-* ]]; then
                        PRERELEASE="${VERSION#*-}"
                        TAGS+=$'\n'"${PRERELEASE%%.*}"
                    else
                        IFS='.' read -r MAJOR MINOR _ <<< "$VERSION"
                        TAGS+=$'\n'"$MAJOR"$'\n'"$MAJOR.$MINOR"
                    fi
                    TAGS+=$'\n'"$VERSION"

                    {
                        echo "docker_tags<<EOF"
                        echo "$TAGS"
                        echo "EOF"
                    } >> "$GITHUB_OUTPUT"

            -   name: Checkout
                if: steps.flags.outputs.should_publish == 'true'
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0

            -   name: Install
                if: steps.flags.outputs.should_publish == 'true'
                uses: ./.github/actions/install
                with:
                    node-version: ${{ env.NODE_VERSION }}

            -   name: Build
                if: steps.flags.outputs.should_publish == 'true'
                uses: ./.github/actions/build

            -   name: Publish
                if: steps.flags.outputs.should_publish == 'true'
                uses: tada5hi/monoship@v2.1.0
                with:
                    token: ${{ secrets.NPM_TOKEN }}

            -   uses: tada5hi/craneship@v4
                if: steps.flags.outputs.should_publish == 'true'
                with:
                    cleanup: false
                    registryRepository: authup/authup
                    registryTag: ${{ steps.flags.outputs.docker_tags }}

            -   uses: tada5hi/craneship@v4
                if: steps.flags.outputs.should_publish == 'true'
                with:
                    registryHost: docker.io
                    registryRepository: authup/authup
                    registryUser: authup
                    registryTag: ${{ steps.flags.outputs.docker_tags }}
                    registryPassword: ${{ secrets.DOCKER_HUB_TOKEN }}
