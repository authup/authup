<svg width="960" height="440" viewBox="0 0 960 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ar-title ar-desc">
    <title id="ar-title">How an Authup deployment fits between your applications and your APIs</title>
    <desc id="ar-desc">Your applications sign in at Authup with the authorization code flow, client credentials or the device grant and receive tokens. One Authup process serves the OAuth2 and OpenID Connect endpoints, the management API and the auth, admin and account consoles on one origin, backed by PostgreSQL or MySQL and optionally Redis. Your applications send the access token to your APIs, which verify it against the realm's published keys or through token introspection. The same image scales out by starting the core, console and worker roles separately.</desc>

    <style>
        :root {
            --fg: #1F2330;
            --muted: #5A6075;
            --panel: #F5F6FB;
            --panel-edge: #D5D9EA;
            --card: #FFFFFF;
            --rail: #8C93AD;
            --peri: #5566B4;
            --rose: #B5686C;
            --green: #3F8A5B;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #EEF0F8;
                --muted: #A0A6BC;
                --panel: #171A24;
                --panel-edge: #343A4F;
                --card: #0F121A;
                --rail: #6B7290;
                --peri: #9AA8E6;
                --rose: #E0A2A2;
                --green: #7CC497;
            }
        }
        text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--fg); }
        .muted { fill: var(--muted); }
        .code { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
        .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
        .title { font-size: 15px; font-weight: 600; }
        .panel { fill: var(--panel); stroke: var(--panel-edge); }
        .card { fill: var(--card); }
        .rail { stroke: var(--rail); }
        .chip { fill: var(--card); stroke: var(--panel-edge); }
        .peri { stroke: var(--peri); }
        .rose { stroke: var(--rose); }
        .green { stroke: var(--green); }
        .t-peri { fill: var(--peri); }
        .t-rose { fill: var(--rose); }
        .t-green { fill: var(--green); }
    </style>

    <defs>
        <marker id="ar-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#8C93AD"/>
        </marker>
    </defs>

    <!-- your applications -->
    <rect class="panel" x="16" y="16" width="236" height="320" rx="18"/>
    <text class="label t-rose" x="36" y="44">YOUR APPLICATIONS</text>
    <rect class="card rose" x="36" y="62" width="196" height="74" rx="12" stroke-width="1.5"/>
    <text class="title" x="54" y="90">Web app</text>
    <text class="code muted" x="54" y="114" font-size="12">authorization code</text>
    <text class="code muted" x="54" y="128" font-size="12">+ PKCE</text>
    <rect class="card rose" x="36" y="148" width="196" height="74" rx="12" stroke-width="1.5"/>
    <text class="title" x="54" y="176">Service</text>
    <text class="code muted" x="54" y="200" font-size="12">client_credentials</text>
    <rect class="card rose" x="36" y="234" width="196" height="82" rx="12" stroke-width="1.5"/>
    <text class="title" x="54" y="262">CLI or TV</text>
    <text class="code muted" x="54" y="286" font-size="12">device_code</text>
    <text class="code muted" x="54" y="302" font-size="12">authup login</text>

    <!-- authup -->
    <rect class="panel" x="308" y="16" width="344" height="320" rx="18"/>
    <text class="label t-peri" x="328" y="44">AUTHUP · ONE PROCESS, ONE ORIGIN</text>
    <rect class="card peri" x="328" y="62" width="304" height="112" rx="12" stroke-width="1.5"/>
    <text class="title" x="346" y="90">server-core</text>
    <text class="code muted" x="346" y="114" font-size="12">/authorize  /token  /userinfo</text>
    <text class="code muted" x="346" y="132" font-size="12">/realms/:realm/jwks</text>
    <text class="code muted" x="346" y="150" font-size="12">/users  /roles  /permissions …</text>
    <text class="label muted" x="328" y="200">CONSOLES</text>
    <rect class="chip" x="328" y="212" width="92" height="28" rx="14"/>
    <text class="code" x="374" y="230" font-size="10.5" text-anchor="middle">/console/auth</text>
    <rect class="chip" x="424" y="212" width="98" height="28" rx="14"/>
    <text class="code" x="473" y="230" font-size="10.5" text-anchor="middle">/console/admin</text>
    <rect class="chip" x="526" y="212" width="106" height="28" rx="14"/>
    <text class="code" x="579" y="230" font-size="10.5" text-anchor="middle">/console/account</text>
    <text class="label muted" x="328" y="270">STORAGE</text>
    <rect class="chip" x="328" y="282" width="150" height="28" rx="14"/>
    <text x="403" y="300" font-size="12" text-anchor="middle">PostgreSQL or MySQL</text>
    <rect class="chip" x="486" y="282" width="146" height="28" rx="14" stroke-dasharray="4 3"/>
    <text x="559" y="300" font-size="12" text-anchor="middle">Redis, optional</text>

    <!-- your apis -->
    <rect class="panel" x="700" y="16" width="244" height="320" rx="18"/>
    <text class="label t-green" x="720" y="44">YOUR APIS</text>
    <rect class="card green" x="720" y="62" width="204" height="138" rx="12" stroke-width="1.5"/>
    <text class="title" x="738" y="90">Verify the token</text>
    <text class="muted" x="738" y="116" font-size="12">Locally: check the signature</text>
    <text class="muted" x="738" y="132" font-size="12">with the realm's keys.</text>
    <text class="muted" x="738" y="160" font-size="12">Or remotely: introspect it,</text>
    <text class="muted" x="738" y="176" font-size="12">which also returns permissions.</text>

    <!-- tokens: authup to the applications -->
    <path class="rail" d="M308 118 H256" stroke-width="2" marker-end="url(#ar-head)"/>
    <path class="rail" d="M252 176 H304" stroke-width="2" marker-end="url(#ar-head)"/>
    <rect class="chip" x="259" y="96" width="42" height="18" rx="9"/>
    <text class="code" x="280" y="109" font-size="10" text-anchor="middle">token</text>
    <rect class="chip" x="254" y="180" width="52" height="18" rx="9"/>
    <text class="code" x="280" y="193" font-size="10" text-anchor="middle">sign in</text>
    <!-- keys: authup publishes them, the APIs cache them -->
    <path class="rail" d="M652 118 H696" stroke-width="2" marker-end="url(#ar-head)"/>
    <rect class="chip" x="656" y="96" width="42" height="18" rx="9"/>
    <text class="code" x="677" y="109" font-size="10" text-anchor="middle">JWKS</text>
    <!-- bearer: the applications call the APIs -->
    <path class="rail" d="M134 336 V364 H822 V340" stroke-width="2" marker-end="url(#ar-head)"/>

    <!-- one pass: a token is issued, carried to the API, then the API reads the keys -->
    <g opacity="0">
        <circle r="9" fill="#6D7FCC" fill-opacity="0.25"/>
        <circle r="4.5" fill="#6D7FCC"/>
        <animateMotion dur="0.8s" repeatCount="1" fill="freeze" path="M308 118 H256"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="0.8s" repeatCount="1" fill="freeze"/>
    </g>
    <g opacity="0">
        <circle r="9" fill="#6D7FCC" fill-opacity="0.25"/>
        <circle r="4.5" fill="#6D7FCC"/>
        <animateMotion dur="2s" begin="0.8s" repeatCount="1" fill="freeze" path="M134 336 V364 H822 V340"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="2s" begin="0.8s" repeatCount="1" fill="freeze"/>
    </g>
    <g opacity="0">
        <circle r="9" fill="#4F9D6B" fill-opacity="0.25"/>
        <circle r="4.5" fill="#4F9D6B"/>
        <animateMotion dur="0.8s" begin="2.8s" repeatCount="1" fill="freeze" path="M656 118 H700"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="0.8s" begin="2.8s" repeatCount="1" fill="freeze"/>
    </g>

    <!-- drawn after the dots, so the bearer dot passes behind the label -->
    <rect class="chip" x="380" y="352" width="200" height="24" rx="12"/>
    <text class="code" x="480" y="368" font-size="11" text-anchor="middle">Authorization: Bearer …</text>

    <!-- scaling note -->
    <rect class="panel" x="16" y="392" width="928" height="40" rx="14" stroke-dasharray="5 5"/>
    <text class="muted" x="36" y="417" font-size="13">More traffic, same image and same authup.yml: run <tspan class="code" font-size="12" style="fill: var(--fg)">authup start core</tspan>, <tspan class="code" font-size="12" style="fill: var(--fg)">start console</tspan> and <tspan class="code" font-size="12" style="fill: var(--fg)">start worker</tspan> as separate replicas.</text>
</svg>
